[package]
name = "to-kiro"
version = "0.1.0"
edition = "2021"
description = "Import the rules, MCP servers and skills of other AI coding assistants into Kiro with one command"
license = "MIT"

[lib]
name = "to_kiro"
path = "src/lib.rs"

[[bin]]
name = "to-kiro"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.15"
dialoguer = "0.11"
dirs = "5"
serde_json = { version = "1", features = ["preserve_order"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
